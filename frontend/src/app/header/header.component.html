

<p-toast position="top-right"></p-toast>

<header class="navbar" [class.scrolled]="isScrolled">

  <div class="navbar-inner">

    <a
      routerLink="/main-menu"
      class="logo-link">

      <img
        src="../../assets/logo.png"
        alt="Logo Colégio Lumier"
        class="logo-img">

    </a>

    <nav class="nav-links">

      <a
        *ngFor="let link of menuItems"
        class="nav-link"
        [routerLink]="link.routerLink"
        routerLinkActive="active">

        {{ link.label }}

      </a>

    </nav>

    <div class="nav-actions">

      <button
        *ngIf="loginService.isAdmin()"
        class="admin-btn"
        (click)="toggleTieredMenu($event)">

        <i class="pi pi-th-large"></i>
        <span>Admin</span>

      </button>

      <button
        *ngIf="isLoggedIn()"
        class="logout-btn"
        (click)="logout()">

        <i class="pi pi-sign-out"></i>
        <span>Sair</span>

      </button>

      <p-tieredMenu
        #tieredMenu
        [model]="adminItems"
        [popup]="true"
        styleClass="custom-tiered">
      </p-tieredMenu>

      <button
        class="hamburger"
        (click)="menuVisible = !menuVisible"
        aria-label="Abrir menu">

        <span></span>
        <span></span>
        <span></span>

      </button>

    </div>

  </div>

</header>


<p-sidebar
  [(visible)]="menuVisible"
  position="right"
  styleClass="custom-sidebar">

  <div class="sidebar-header">

    <img
      src="../../assets/logo.png"
      alt="Logo Colégio Lumier"
      class="sidebar-logo">

  </div>

  <nav class="sidebar-nav">

    <a
      *ngFor="let link of menuItems"
      class="sidebar-link"
      [routerLink]="link.routerLink"
      (click)="menuVisible = false">

      {{ link.label }}

    </a>

  </nav>

  <div class="sidebar-footer">

    <a
      class="sidebar-cta"
      (click)="openWhatsApp(); menuVisible = false">

      <i class="pi pi-whatsapp"></i>
      Fale pelo WhatsApp

    </a>

  </div>

</p-sidebar>


<p-dialog
  [(visible)]="showLogoutDialog"
  [modal]="true"
  [draggable]="false"
  [closable]="false"
  [style]="{ width: '380px' }"
  styleClass="logout-dialog">

  <ng-template pTemplate="header">

    <div class="logout-dialog-header">

      <div class="logout-icon">
        👋
      </div>

      <div>

        <p class="logout-eyebrow">
          Atenção
        </p>

        <span class="logout-title">
          Deseja sair?
        </span>

      </div>

    </div>

  </ng-template>

  <div class="logout-dialog-body">

    <p>
      Você será desconectado da sua conta.
    </p>

  </div>

  <ng-template pTemplate="footer">

    <div class="logout-dialog-footer">

      <button
        class="dlg-btn cancel"
        (click)="showLogoutDialog = false">

        Cancelar

      </button>

      <button
        class="dlg-btn confirm"
        (click)="confirmLogout()">

        <i class="pi pi-sign-out"></i>
        Sim, sair

      </button>

    </div>

  </ng-template>

</p-dialog>
