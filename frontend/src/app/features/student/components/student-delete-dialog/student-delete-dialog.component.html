
<p-dialog [(visible)]="visible" [style]="{width:'440px'}" [modal]="true" [draggable]="false"
  styleClass="custom-dialog">
  <ng-template pTemplate="header">
    <div class="dialog-header">
      <div class="dialog-icon danger">🗑️</div>
      <div>
        <p class="dialog-eyebrow">Atenção</p>
        <span class="dialog-title">Excluir Aluno</span>
      </div>
    </div>
  </ng-template>
  <div class="dialog-body">
    <p>Você está prestes a excluir <strong>{{ student?.name }}</strong>.</p>
    <p class="dialog-warn"> Essa ação não pode ser desfeita.</p>
  </div>
  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <button class="dlg-btn cancel" (click)="closeDialog()">Cancelar</button>
      <button class="dlg-btn confirm-delete" (click)="confirmDeleteStudent()">
        <i class="pi pi-trash"></i> Excluir
      </button>
    </div>
  </ng-template>
</p-dialog>
